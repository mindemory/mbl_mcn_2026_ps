<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCN Alumni Network · MBL Woods Hole</title>
  <meta name="description" content="Interactive alumni connectivity graph for the MBL Methods in Computational Neuroscience course, showing co-attendance and career trajectories." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="data.js"></script>
  <!-- Co-authorship edges (generated by enrich_collabs.py). Optional: the
       graph falls back to co-attendance-only if this file is absent. -->
  <script src="collabs.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="logo-badge">MCN</div>
      <div class="header-text">
        <h1>Alumni Network</h1>
        <span class="subtitle">Methods in Computational Neuroscience · MBL Woods Hole</span>
      </div>
    </div>
    <div class="header-stats" id="headerStats">
      <div class="stat-pill"><span id="statNodes">–</span> people</div>
      <div class="stat-pill"><span id="statEdges">–</span> connections</div>
      <div class="stat-pill"><span id="statYears">–</span> cohorts</div>
    </div>
  </header>

  <!-- Controls Panel -->
  <div id="controls">
    <div class="control-group">
      <label class="control-label">COHORT YEAR</label>
      <div class="year-pills" id="yearPills"></div>
    </div>
    <div class="control-group">
      <label class="control-label">ROLE</label>
      <div class="role-pills" id="rolePills">
        <button class="role-btn active" data-role="all">All</button>
        <button class="role-btn" data-role="student">Students</button>
        <button class="role-btn" data-role="faculty">Faculty</button>
        <button class="role-btn" data-role="director">Directors</button>
        <button class="role-btn" data-role="lecturer">Lecturers</button>
        <button class="role-btn" data-role="ta">TAs</button>
      </div>
    </div>
    <div class="control-group">
      <label class="control-label">CONNECTIONS</label>
      <div class="role-pills" id="edgeModePills">
        <button class="role-btn" data-edgemode="attend">Co-attendance</button>
        <button class="role-btn" data-edgemode="collab">Co-authorship</button>
        <button class="role-btn active" data-edgemode="both">Both</button>
      </div>
    </div>
    <div class="control-group">
      <label class="control-label">COLOR BY</label>
      <div class="role-pills" id="colorByPills">
        <button class="role-btn active" data-colorby="year">Year</button>
        <button class="role-btn" data-colorby="role">Role</button>
        <button class="role-btn" data-colorby="degree">Connections</button>
      </div>
    </div>
    <div class="control-group">
      <label class="control-label">LAYOUT</label>
      <div class="role-pills">
        <button class="role-btn active" id="btnForce">Force</button>
        <button class="role-btn" id="btnRadial">Radial</button>
      </div>
    </div>
    <div class="control-group search-group">
      <label class="control-label">SEARCH</label>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Name or affiliation…" />
        <span class="search-icon">⌕</span>
      </div>
    </div>
  </div>

  <!-- Graph Canvas -->
  <div id="graphContainer">
    <svg id="graph"></svg>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="legend" class="legend"></div>
  </div>

  <!-- Detail Panel -->
  <div id="detailPanel" class="detail-panel hidden">
    <button id="closeDetail" class="close-btn">✕</button>
    <div id="detailContent"></div>
  </div>

  <!-- Footer -->
  <footer id="footer">
    <span>Data from <a href="https://history.archives.mbl.edu/people-and-courses/course-group/methods-computational-neuroscience" target="_blank">MBL History Archives</a></span>
    <span>·</span>
    <span>Edges: co-attendance (same cohort) &amp; co-authorship (shared papers, via OpenAlex)</span>
    <span>·</span>
    <span>Built for the MCN 2026 community 🐟</span>
  </footer>

  <script src="graph.js"></script>
</body>
</html>
